<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't Starve Chain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fff;
    }

    #game-container {
      flex-shrink: 0;
      width: 800px;
      height: 600px;
      position: relative;
      margin: auto 0 auto 0;
    }

    /* HUD overlay on top of canvas */
    #hud-root {
      position: absolute;
      top: 0; left: 0;
      width: 800px; height: 600px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-bars {
      position: absolute;
      top: 12px; left: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-icon { font-size: 14px; width: 20px; }

    .hud-bar-bg {
      width: 140px; height: 12px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .hud-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .hud-val {
      font-size: 11px;
      color: #ccc;
      min-width: 28px;
    }

    .hud-top-right {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .hud-day   { font-size: 16px; color: #FFD700; font-weight: bold; }
    .hud-phase { font-size: 13px; color: #aaa; }
    .hud-class { font-size: 12px; color: #52b788; }

    .hud-tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid #444;
      z-index: 20;
    }

    /* Side panels */
    #ui-panels {
      width: 240px;
      height: 600px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      overflow-y: auto;
      background: #0d1117;
      border-left: 1px solid #222;
    }

    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
    }

    .panel-title {
      font-size: 13px;
      color: #FFD700;
      font-weight: bold;
      margin-bottom: 8px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 4px;
    }

    .empty-msg { font-size: 12px; color: #666; }

    .inv-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .inv-slot {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px;
      border-radius: 4px;
      background: #0d1117;
    }

    .inv-icon {
      width: 18px; height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .inv-name { font-size: 12px; color: #ccc; flex: 1; }
    .inv-count { font-size: 11px; color: #888; }

    /* Crafting */
    .craft-list { display: flex; flex-direction: column; gap: 6px; }

    .craft-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      border-radius: 4px;
      background: #0d1117;
      gap: 6px;
    }

    .craft-row.unavail { opacity: 0.45; }

    .craft-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .craft-name { font-size: 13px; color: #fff; }
    .craft-req  { font-size: 10px; color: #666; }

    .craft-btn {
      background: #2d6a4f;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .craft-btn:hover:not([disabled]) { background: #40916c; }
    .craft-btn[disabled] { background: #333; cursor: not-allowed; }

    /* Notifications */
    #notif-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
      max-width: 500px;
      width: 90%;
    }

    .notif {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      border-left: 4px solid transparent;
    }

    .notif.visible { opacity: 1; transform: translateY(0); }
    .notif-info    { background: #0f3460; border-color: #4d9de0; color: #a8d8ea; }
    .notif-success { background: #1b4332; border-color: #52b788; color: #95d5b2; }
    .notif-warn    { background: #3d3000; border-color: #e9c46a; color: #ffd166; }
    .notif-error   { background: #450a0a; border-color: #e63946; color: #ff8080; }

    /* Combat modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal.hidden { display: none; }

    .modal-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
      min-width: 360px;
      max-width: 460px;
    }

    .modal-box h2 { font-size: 20px; color: #FFD700; margin-bottom: 8px; }
    .monster-stats { font-size: 12px; color: #888; margin-bottom: 16px; }

    .modal-section { margin-bottom: 16px; }
    .modal-section label { display: block; font-size: 13px; color: #ccc; margin-bottom: 8px; }

    .stance-group { display: flex; flex-direction: column; gap: 6px; }

    .stance-btn {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #ccc;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .stance-btn.active { border-color: #52b788; color: #52b788; background: #1b4332; }
    .stance-btn:hover:not(.active) { border-color: #555; color: #fff; }

    #weapon-select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #ccc;
      padding: 6px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }

    .btn-primary {
      flex: 1;
      background: #2d6a4f;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary:hover { background: #40916c; }

    .btn-secondary {
      background: #333;
      color: #ccc;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-secondary:hover { background: #444; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud-root"></div>
  </div>
  <div id="ui-panels">
    <div id="inventory-panel" class="panel"></div>
    <div id="crafting-panel"  class="panel"></div>
  </div>
  <div id="combat-modal" class="modal hidden"></div>
  <div id="notif-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
